spring.application.name=salvo-api
spring.profiles.active=local

# ---------- Banco (Supabase Postgres) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.postgresql.transactional.lock=false

# ---------- Supabase Auth (JWT) ----------
salvo.security.supabase.issuer=${SUPABASE_AUTH_ISSUER:https://seu-projeto.supabase.co/auth/v1}
salvo.security.supabase.jwk-set-uri=${SUPABASE_AUTH_JWK_SET_URI:https://seu-projeto.supabase.co/auth/v1/.well-known/jwks.json}
salvo.security.supabase.auth-url=${SUPABASE_AUTH_URL:https://gkgnfxkbwexpihqybcue.supabase.co/auth/v1}
salvo.security.supabase.anon-key=${SUPABASE_ANON_KEY:}
salvo.security.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
